services:
  # Entorno de DESARROLLO (hot-reload). Uso: docker compose up
  sgm-portal-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sgm-portal-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
